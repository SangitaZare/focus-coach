# Runs the unit tests on GitHub's servers on every push and pull request.
# The tests don't need a camera or the YOLO models (that's why the logic is
# kept separate from detector.py), so only pandas and matplotlib are installed:
# no 800 MB PyTorch download, and the run takes under a minute.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: pip install pandas==3.1.0 matplotlib==3.11.2
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
